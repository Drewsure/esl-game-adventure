* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'Comic Sans MS','Chalkboard SE','Comic Neue','Nunito',system-ui,sans-serif; overscroll-behavior:none; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; background:#0F172A; overflow-x:hidden; }
.screen { display:none; min-height:100vh; width:100%; }
.screen.active { display:flex; flex-direction:column; }

#hub-screen { background:linear-gradient(135deg,#1E3A8A,#7C3AED,#EC4899); align-items:center; justify-content:center; padding:1rem; position:relative; overflow:hidden; }
.hub-title { font-size:clamp(2rem,6vw,4rem); color:white; text-shadow:0 4px 0 rgba(0,0,0,0.3),0 8px 20px rgba(0,0,0,0.4); text-align:center; font-weight:900; line-height:1; margin-bottom:0.5rem; }
.hub-subtitle { color:rgba(255,255,255,0.8); text-align:center; font-size:1.125rem; font-weight:bold; margin-bottom:1.5rem; text-shadow:0 2px 4px rgba(0,0,0,0.3); }
.hub-stars { display:flex; align-items:center; gap:0.5rem; background:rgba(255,255,255,0.15); backdrop-filter:blur(8px); border:2px solid rgba(255,255,255,0.3); padding:0.5rem 1.5rem; border-radius:9999px; margin-bottom:1.5rem; }
.hub-stars span { color:#FBBF24; font-size:1.5rem; font-weight:900; }
.game-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; max-width:42rem; margin:0 auto; }
@media(max-width:480px) { .game-grid { grid-template-columns:1fr; } }
.game-card { border-radius:1.5rem; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.3); border:4px solid rgba(255,255,255,0.2); cursor:pointer; transition:all 0.2s; }
.game-card:hover { transform:translateY(-5px) scale(1.03); box-shadow:0 15px 40px rgba(0,0,0,0.4); }
.game-card:active { transform:scale(0.97); }
.game-card-header { padding:1.5rem 1rem; display:flex; flex-direction:column; align-items:center; gap:0.5rem; color:white; }
.game-card-emoji { font-size:3rem; }
.game-card-name { font-size:1.25rem; font-weight:900; text-shadow:0 2px 4px rgba(0,0,0,0.3); text-align:center; }
.game-card-desc { font-size:0.75rem; opacity:0.9; text-align:center; }
.game-card-stars { display:flex; align-items:center; gap:0.25rem; background:rgba(255,255,255,0.2); padding:0.25rem 0.75rem; border-radius:9999px; font-size:0.75rem; }
.hub-footer { color:rgba(255,255,255,0.5); font-size:0.75rem; text-align:center; margin-top:1.5rem; }
.topbar { position:sticky; top:0; z-index:30; background:rgba(255,255,255,0.95); border-bottom:3px solid #E5E7EB; padding:0.5rem 1rem; display:flex; align-items:center; justify-content:space-between; }
.topbar-btn { padding:0.375rem 1rem; border-radius:9999px; background:white; border:2px solid #D1D5DB; font-weight:bold; color:#374151; cursor:pointer; font-size:0.875rem; font-family:inherit; }
.topbar-info { font-weight:bold; color:#374151; font-size:0.875rem; }
.star-badge { display:flex; align-items:center; gap:0.25rem; background:#FEF3C7; border:2px solid #FBBF24; padding:0.25rem 0.75rem; border-radius:9999px; font-weight:bold; color:#92400E; }
.settings-row { position:absolute; top:1rem; right:1rem; display:flex; gap:0.5rem; z-index:20; }
.settings-btn { width:3rem; height:3rem; border-radius:50%; background:rgba(255,255,255,0.3); backdrop-filter:blur(8px); border:2px solid rgba(255,255,255,0.5); font-size:1.5rem; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit; }
.game-frame { width:100%; height:calc(100vh - 50px); border:none; }
.hidden { display:none !important; }
</style>

var GAMES = {
  'preposition-park': { name:'Preposition Park', emoji:'🏠', color:'#EC4899', tagline:'ON, IN, UNDER, BY' },
  'veggie-garden': { name:'Veggie Garden', emoji:'🥕', color:'#22C55E', tagline:'I like vegetables!' },
  'clock-town': { name:'Clock Town', emoji:'⏰', color:'#3B82F6', tagline:'What time is it?' },
  'pet-town': { name:'Pet Town', emoji:'🐾', color:'#F472B6', tagline:'Do you have any pets?' },
  'number-town': { name:'Number Town', emoji:'🔢', color:'#06B6D4', tagline:'Count 1 to 12!' },
};
var SAVE_KEYS = {
  'preposition-park': 'preposition-park-save',
  'veggie-garden': 'veggie-garden-save',
  'clock-town': 'clock-town-save',
  'pet-town': 'pet-town-save',
  'number-town': 'number-town-save',
};
var state = { soundEnabled: true, narrationEnabled: true };
function loadSettings() { try { var s = JSON.parse(localStorage.getItem('esl-hub-settings') || '{}'); state.soundEnabled = s.soundEnabled !== false; state.narrationEnabled = s.narrationEnabled !== false; } catch(e) {} }
function saveSettings() { try { localStorage.setItem('esl-hub-settings', JSON.stringify(state)); } catch(e) {} }
function toggleSound() { state.soundEnabled = !state.soundEnabled; saveSettings(); updateButtons(); }
function toggleNarration() { state.narrationEnabled = !state.narrationEnabled; saveSettings(); updateButtons(); }
function updateButtons() { document.getElementById('sound-btn').textContent = state.soundEnabled ? '🔊' : '🔇'; document.getElementById('narration-btn').textContent = state.narrationEnabled ? '🗣️' : '💤'; }
function gameStars(gameId) { try { var s = JSON.parse(localStorage.getItem(SAVE_KEYS[gameId]) || '{}'); var p = s.progress || {}; return Object.keys(p).reduce(function(sum, k) { return sum + (p[k].stars || 0); }, 0); } catch(e) { return 0; } }
function totalStars() { return Object.keys(GAMES).reduce(function(s, id) { return s + gameStars(id); }, 0); }
function showScreen(id) { document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); }); document.getElementById(id + '-screen').classList.add('active'); }
function renderHub() {
  document.getElementById('total-stars').textContent = totalStars();
  updateButtons();
  var grid = document.getElementById('game-grid');
  grid.innerHTML = '';
  Object.keys(GAMES).forEach(function(id) {
    var G = GAMES[id];
    var stars = gameStars(id);
    var maxStars = 120;
    var card = document.createElement('div');
    card.className = 'game-card';
    card.style.background = 'linear-gradient(135deg,' + G.color + '33,' + G.color + '88)';
    card.innerHTML = '<div class="game-card-header" style="background:' + G.color + ';"><div class="game-card-emoji">' + G.emoji + '</div><div class="game-card-name">' + G.name + '</div><div class="game-card-desc">' + G.tagline + '</div><div class="game-card-stars"><span>⭐</span><span>' + stars + '/' + maxStars + '</span></div></div>';
    card.onclick = function() { launchGame(id); };
    grid.appendChild(card);
  });
}
function launchGame(gameId) {
  showScreen('game');
  var container = document.getElementById('game-container');
  container.innerHTML = '';
  var iframe = document.createElement('iframe');
  iframe.className = 'game-frame';
  container.appendChild(iframe);
  var b64 = GAME_B64[gameId];
  var binary = atob(b64);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
  var html = new TextDecoder('utf-8').decode(bytes);
  iframe.contentDocument.open();
  iframe.contentDocument.write(html);
  iframe.contentDocument.close();
  document.getElementById('game-info').textContent = GAMES[gameId].emoji + ' ' + GAMES[gameId].name;
  document.getElementById('game-stars').textContent = gameStars(gameId);
}
function goBack() { document.getElementById('game-container').innerHTML = ''; showScreen('hub'); renderHub(); }
loadSettings();
renderHub();
</script>
